<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microeconomics Advent Calendar 2025</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="snowflakes" aria-hidden="true">
        <div class="snowflake">*</div>
        <div class="snowflake">*</div>
        <div class="snowflake">*</div>
        <div class="snowflake">*</div>
        <div class="snowflake">*</div>
    </div>

    <header>
        <h1>Microeconomics Advent Calendar</h1>
        <p class="subtitle">Bettina's CBS Study Group - December 2025</p>
    </header>

    <main>
        <div class="calendar-grid" id="calendar">
            <!-- Days will be generated by JavaScript -->
        </div>
    </main>

    <!-- Modal for day content -->
    <div class="modal" id="dayModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div class="day-header">
                <span class="day-number" id="modalDay"></span>
                <span class="day-topic" id="modalTopic"></span>
            </div>
            <div class="question-section">
                <h3>Today's Question</h3>
                <p id="modalQuestion"></p>
            </div>
            <div class="response-section" id="responseSection">
                <h3>Your Response</h3>
                <select id="memberSelect">
                    <option value="">Select your name...</option>
                </select>
                <textarea id="responseText" placeholder="Write your 2-3 paragraph response here..."></textarea>
                <button onclick="saveResponse()" class="save-btn">Save Response</button>
            </div>
            <div class="team-responses" id="teamResponses">
                <h3>Team Responses</h3>
                <div id="responsesList"></div>
            </div>
            <div class="answer-section" id="answerSection">
                <h3>Model Answer</h3>
                <p id="modalAnswer"></p>
            </div>
        </div>
    </div>

    <footer>
        <p>Made with care by MEasAI Team</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
